<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Premium Liquids</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>


<body>


<div class="background-glow"></div>


<header class="header">

    <div class="logo">
        Fluffy<span>SHOP</span>
    </div>


    <div class="header-text">
        Premium liquids delivered fast
    </div>

</header>




<main class="container">


<section class="hero">

    <h1>
        Выбери свой вкус!!
    </h1>

    <p>
        Премиальные жижи и быстрая доставка по всей Германии
    </p>

</section>





<section class="products" id="products">


<!-- PRODUCTS GENERATED BY JAVASCRIPT -->

</section>



</main>






<!-- CART -->

<div class="cart-bar" id="cartBar">


    <div class="cart-info">

        <div class="cart-icon">
            🛒
        </div>


        <div>

            <div class="cart-title">
                Корзина
            </div>


            <div class="cart-count" id="cartCount">
                0 продуктов
            </div>

        </div>


    </div>





    <div class="cart-price">

        <span id="cartTotal">
            0.00€
        </span>


        <button id="openCart">
            Чек
        </button>

    </div>


</div>



<!-- CART WINDOW -->


<div class="cart-modal" id="cartModal">

<div class="cart-content">

<div class="cart-header">

<h2>
Твой заказ
</h2>

<button id="closeCart">
✕
</button>

</div>

<div id="cartItems">

</div>

<div class="cart-summary">

<div>
Products:
<span id="modalProducts">
0
</span>
</div>

<div>
Тотал:
<strong id="modalTotal">
0.00€
</strong>
</div>

</div>

<button class="telegram-button" id="telegramOrder">

Заказать через телеграмм
</button>

</div>

</div>

<div class="toast" id="toast">

Добавлено в корзину!

</div>

<script src="script.js"></script>

</body>
</html>
